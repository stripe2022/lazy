<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/lazy/manifest.json">
  <link rel="stylesheet" href="/lazy/styles.css">
  <script defer src="/lazy/app.js"></script>

  <title>Barylie Pedidos</title>
</head>

<body>

<header>🧾 Barylie Pedidos</header>

<!-- ================= INICIO ================= -->
<section class="section active" id="inicio">
  <div class="wrap">
    <button onclick="abrirPantalla('pedido')">🛒 Nuevo pedido</button>
    <button onclick="abrirPantalla('cola')">🗂️ Cola de pedidos</button>

    <button onclick="document.getElementById('importarProductosInput').click()">
      📦 Importar productos
    </button>

    <input type="file" id="importarProductosInput" accept=".json" style="display:none" />

    <footer>
      📦 Total productos cargados:
      <span id="total-productos">0</span>
    </footer>
  </div>
</section>

<!-- ================= PANTALLA 1 ================= -->
<section class="section" id="pedido">
  <div class="wrap">
    <button class="back" onclick="abrirPantalla('inicio')">⬅️ Atrás</button>

    <h2>🛒 Nuevo pedido</h2>

    <label>🧍📞📍 Cliente / Tel / Dirección</label>
    <input type="text" id="clienteInfo" placeholder="Nombre · Teléfono · Dirección" />

    <label>🔎 Buscar producto</label>
    <input type="text" id="busqueda" placeholder="Escribe para filtrar..." autocomplete="off" />

    <label>📦 Producto</label>
    <select id="producto">
      <option value="">-- Selecciona un producto --</option>
    </select>

    <label>🔢 Cantidad</label>
    <input type="number" id="cantidad" min="1" value="1" />

    <button onclick="agregarProducto()">➕ Añadir producto</button>

    <div id="lista-productos"></div>

    <div class="card">
      <div class="row">
        <strong>🧾 Total productos:</strong>
        <span>$<span id="total-productos-pedido">0</span></span>
      </div>
    </div>

    <div class="card">
      <p><strong>🚚 Entrega</strong></p>

      <label style="display:block; margin:.4rem 0;">
        <input type="radio" name="entrega" value="tienda" checked />
        🏬 Recogida
      </label>

      <label style="display:block; margin:.4rem 0;">
        <input type="radio" name="entrega" value="domicilio" />
        🛵 Domicilio
      </label>

      <div id="bloque-envio" style="display:none; margin-top:.7rem;">
        <label>🛵 Costo de Mensajeria</label>
        <input type="number" id="envio" min="0" step="1" placeholder="200" />

        <div class="btn-row">
          <button type="button" onclick="setEnvio(200)">200</button>
          <button type="button" onclick="setEnvio(300)">300</button>
          <button type="button" onclick="setEnvio(350)">350</button>
          <button type="button" onclick="setEnvio(400)">400</button>
        </div>
      </div>

      <hr>

      <div class="row">
        <strong>💰 Total final:</strong>
        <span>$<span id="total-final">0</span></span>
      </div>
    </div>

    <div class="card">
      <button type="button" onclick="generarVistaPrevia()">👀 Vista previa WhatsApp</button>
      <button type="button" onclick="copiarVistaPrevia()">📋 Copiar WhatsApp</button>

      <div id="previewBox">
        <div style="opacity:.7; text-align:center;">Aún no hay vista previa</div>
      </div>
    </div>

    <button type="button" onclick="anadirACola()">➕ Añadir a cola (limpia automático)</button>
  </div>
</section>

<!-- ================= COLA ================= -->
<section class="section" id="cola">
  <div class="wrap">
    <button class="back" onclick="abrirPantalla('inicio')">⬅️ Atrás</button>

    <h2>🗂️ Cola de pedidos</h2>

    <div id="colaLista"></div>

    <div class="card">
      <!-- ✅ NUEVO: imprimir por separado -->
      <button type="button" onclick="imprimirColaPorTipo('domicilio')">
        🖨 Imprimir domicilios
      </button>

      <button type="button" onclick="imprimirColaPorTipo('tienda')">
        🖨 Imprimir recogidas
      </button>

      <!-- (lo de siempre) -->
      <button type="button" onclick="imprimirCola()">🖨 Imprimir cola</button>

      <button type="button" onclick="vaciarCola()" class="danger">
        🗑 Vaciar cola
      </button>
    </div>
  </div>
</section>
<script>
  // Registro del Service Worker (blindado)
  if ('serviceWorker' in navigator) {
    // No hace falta esperar a window.load
    window.addEventListener('DOMContentLoaded', () => {
      navigator.serviceWorker.register('/lazy/service-worker.js', {
        updateViaCache: 'all',
        scope: '/lazy/'
      }).then(reg => {
        console.log('✅ SW Lazy Barylie registrado:', reg.scope);
        // ⚠️ Muy importante: NO llames reg.update()
      }).catch(err => {
        console.error('❌ Error registrando SW Lazy Barylie:', err);
      });
    });
  }
</script>


<script>
  function abrirPantalla(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if (id === 'pedido') document.dispatchEvent(new Event('pantalla1:open'));
    if (id === 'cola') document.dispatchEvent(new Event('cola:open'));
  }
</script>


</body>
</html>
